name: english_coach
description: AI English Coach - Your Personal English Learning Assistant
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.0

  # Routing
  go_router: ^13.0.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.0
  audioplayers: ^6.1.0
  record: ^6.1.0
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^4.1.0
  timezone: ^0.9.4
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/
